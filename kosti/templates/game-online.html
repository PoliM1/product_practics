<!DOCTYPE html>
<html>
<head>
    <title>Онлайн игра в кости</title>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial Black', Arial, sans-serif; 
            background: 
                linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
                url('/static/game-bg.jpg') center/cover fixed no-repeat;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        .back-home {
            position: absolute; top: 20px; left: 20px;
            background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05)); 
            backdrop-filter: blur(20px); border: 3px solid rgba(255,255,255,0.4);
            border-radius: 15px; padding: 15px 30px; font-size: 1.2em; font-weight: bold;
            color: #ffffff; cursor: pointer; transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8); text-decoration: none;
        }
        .back-home:hover {
            transform: translateY(-5px); border-color: #ffd700; 
            box-shadow: 0 15px 40px rgba(255,215,0,0.4);
        }

        h1 { 
            font-size: 3.5em; text-align: center; margin: 30px 0 50px; 
            color: #ffffff !important; 
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffd700, 2px 2px 4px rgba(0,0,0,0.9);
            letter-spacing: 6px; font-weight: bold;
        }

        .turn-indicator {
            text-align: center; margin-bottom: 30px;
            font-size: 2em; color: #ffd700; font-weight: bold;
            text-shadow: 0 0 15px #ffd700, 2px 2px 4px rgba(0,0,0,0.9);
            padding: 20px; background: rgba(255,215,0,0.1);
            border: 3px solid #ffd700; border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .player-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05)); 
            backdrop-filter: blur(20px); border: 3px solid rgba(255,255,255,0.3);
            border-radius: 30px; padding: 40px 30px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7); transition: all 0.4s;
            position: relative;
        }

        .player-card.active {
            border-color: #ffd700;
            box-shadow: 0 25px 70px rgba(255,215,0,0.5);
            transform: scale(1.05);
        }

        .player-card.winner {
            border-color: #00d4aa;
            box-shadow: 0 25px 70px rgba(0,212,170,0.7);
            animation: winner-glow 1s ease-in-out infinite;
        }

        @keyframes winner-glow {
            0%, 100% { box-shadow: 0 25px 70px rgba(0,212,170,0.5); }
            50% { box-shadow: 0 30px 90px rgba(0,212,170,0.9); }
        }

        .player-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 25px;
        }

        .player-name {
            font-size: 2em; font-weight: bold; color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        .player-score {
            background: rgba(255,215,0,0.3); border: 2px solid #ffd700;
            padding: 10px 20px; border-radius: 20px;
            font-size: 1.5em; font-weight: bold; color: #ffd700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .dice-container {
            display: flex; justify-content: center; gap: 15px;
            flex-wrap: wrap; margin: 30px 0;
        }

        .dice {
            font-size: 5em;
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.8));
            transition: all 0.3s;
        }

        .dice.animate {
            animation: diceRoll 0.8s ease-in-out;
        }

        @keyframes diceRoll { 
            0%, 100% { transform: rotateY(0deg) rotateX(0deg); } 
            25% { transform: rotateY(90deg) rotateX(45deg); } 
            50% { transform: rotateY(180deg) rotateX(90deg); } 
            75% { transform: rotateY(270deg) rotateX(135deg); } 
        }

        .roll-total {
            font-size: 2.5em; color: #00d4aa; font-weight: bold;
            margin: 20px 0; text-shadow: 0 0 15px #00d4aa, 2px 2px 4px rgba(0,0,0,0.9);
        }

        .roll-btn {
            background: linear-gradient(145deg, #00d4aa, #00b894);
            border: none; border-radius: 20px;
            padding: 20px 50px; font-size: 1.5em; font-weight: bold; color: white;
            cursor: pointer; box-shadow: 0 10px 30px rgba(0,212,170,0.5);
            transition: all 0.3s; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .roll-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0,212,170,0.7);
        }

        .roll-btn:disabled {
            background: #666; cursor: not-allowed; opacity: 0.5;
        }

        .game-over {
            display: none;
            text-align: center;
            margin: 40px 0;
            font-size: 4em; font-weight: bold;
            padding: 40px 60px;
            background: rgba(0,212,170,0.25);
            border: 4px solid rgba(0,212,170,0.7);
            border-radius: 30px;
            box-shadow: 0 25px 70px rgba(0,212,170,0.5);
            text-shadow: 3px 3px 8px rgba(0,0,0,0.9);
            color: #fff;
            animation: winner-glow 1.5s ease-in-out infinite;
        }

        .game-over.show {
            display: block;
        }

        .game-buttons {
            text-align: center; margin: 40px 0;
        }

        .btn {
            background: linear-gradient(145deg, #a8edea, #fed6e3);
            border: none; border-radius: 20px;
            padding: 18px 40px; font-size: 1.3em; font-weight: bold;
            color: #333; margin: 0 15px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(168,230,207,0.4);
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(168,230,207,0.6);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            .players-grid { grid-template-columns: 1fr; }
            .player-card { padding: 30px 20px; }
            .dice { font-size: 4em; }
            .game-over { font-size: 2.5em; padding: 30px 40px; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-home">🏠 В меню</a>

    <div class="container">
        <h1>🎲 Онлайн игра 🎲</h1>

        <div id="turnIndicator" class="turn-indicator">
            Ожидание начала игры...
        </div>

        <div id="playersGrid" class="players-grid"></div>

        <div id="gameOver" class="game-over"></div>

        <div class="game-buttons">
            <button class="btn" onclick="newRound()">🔄 Новый раунд</button>
            <button class="btn" onclick="backToMenu()">🏠 В меню</button>
        </div>
    </div>

    <script>
        const roomId = '{{ room_id }}';
        const clientId = Math.random().toString(36).substring(2, 15);
        const ws = new WebSocket(`ws://${window.location.host}/ws/${clientId}`);

        let players = [];
        let settings = {};
        let currentTurn = 0;
        let myPlayerId = clientId;
        let gameStarted = false;

        ws.onopen = () => {
            console.log('Connected to game');
        };

        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);

            if (message.type === 'game_starting') {
                players = message.players;
                settings = message.settings;
                currentTurn = 0;
                gameStarted = true;
                renderPlayers();
                updateTurnIndicator();
            } else if (message.type === 'dice_rolled') {
                handleDiceRoll(message);
            } else if (message.type === 'turn_changed') {
                currentTurn = message.player_index;
                updateTurnIndicator();
                renderPlayers();
            } else if (message.type === 'game_over') {
                handleGameOver(message);
            } else if (message.type === 'lobby_closed') {
                alert(message.message);
                window.location.href = '/online';
            }
        };

        function renderPlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';

            players.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.id = `player-${index}`;

                if (index === currentTurn && gameStarted) {
                    card.classList.add('active');
                }

                const diceHTML = Array(settings.dice_count || 2)
                    .fill('⚀')
                    .map((dice, i) => `<div class="dice" id="dice-${index}-${i}">${dice}</div>`)
                    .join('');

                const isMyTurn = player.id === myPlayerId && index === currentTurn && gameStarted;

                card.innerHTML = `
                    <div class="player-header">
                        <div class="player-name">${player.name}</div>
                        <div class="player-score">${player.score}/${settings.max_score || 50}</div>
                    </div>
                    <div class="dice-container">
                        ${diceHTML}
                    </div>
                    <div class="roll-total" id="total-${index}"></div>
                    ${isMyTurn ? `<button class="roll-btn" onclick="rollDice()">Бросить кости</button>` : ''}
                `;

                grid.appendChild(card);
            });
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turnIndicator');
            if (gameStarted && players.length > 0) {
                const currentPlayer = players[currentTurn];
                indicator.textContent = `Ход игрока: ${currentPlayer.name}`;
            }
        }

        function rollDice() {
            ws.send(JSON.stringify({
                type: 'roll_dice',
                data: { room_id: roomId }
            }));
        }

        function handleDiceRoll(data) {
            const playerIndex = players.findIndex(p => p.name === data.player_name);
            if (playerIndex === -1) return;

            // Анимация костей
            data.dice_results.forEach((result, i) => {
                const diceElement = document.getElementById(`dice-${playerIndex}-${i}`);
                if (diceElement) {
                    diceElement.classList.add('animate');
                    setTimeout(() => {
                        diceElement.textContent = getDiceEmoji(result);
                        diceElement.classList.remove('animate');
                    }, 800);
                }
            });

            // Показываем сумму
            setTimeout(() => {
                const totalElement = document.getElementById(`total-${playerIndex}`);
                if (totalElement) {
                    totalElement.textContent = `Выпало: ${data.total}`;
                }

                // Обновляем счет
                players = data.players;
                renderPlayers();
            }, 900);
        }

        function handleGameOver(data) {
            const gameOver = document.getElementById('gameOver');
            gameOver.textContent = `🎉 ${data.winner} победил! 🎉`;
            gameOver.classList.add('show');

            // Выделяем победителя
            const winnerIndex = players.findIndex(p => p.name === data.winner);
            if (winnerIndex !== -1) {
                const card = document.getElementById(`player-${winnerIndex}`);
                if (card) {
                    card.classList.add('winner');
                }
            }

            gameStarted = false;
        }

        function newRound() {
            const gameOver = document.getElementById('gameOver');
            gameOver.classList.remove('show');

            // Сбрасываем счет
            players.forEach(p => p.score = 0);
            currentTurn = 0;
            gameStarted = true;

            renderPlayers();
            updateTurnIndicator();
        }

        function backToMenu() {
            if (confirm('Вы уверены, что хотите покинуть игру?')) {
                ws.send(JSON.stringify({
                    type: 'leave_lobby',
                    data: { room_id: roomId }
                }));
                window.location.href = '/';
            }
        }

        function getDiceEmoji(num) {
            const emojis = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            return emojis[num - 1];
        }

        // Обработка закрытия страницы
        window.addEventListener('beforeunload', () => {
            ws.send(JSON.stringify({
                type: 'leave_lobby',
                data: { room_id: roomId }
            }));
        });
    </script>
</body>
</html>
