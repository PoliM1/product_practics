<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Сброс пароля</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <span class="logo-icon">🔐</span>
      <h1>TaskFlow</h1>
      <p>Установка нового пароля</p>
    </div>

    <div class="form-group">
      <label>Новый пароль</label>
      <input type="password" id="new-password" placeholder="Минимум 8 символов">
    </div>
    <div class="form-group">
      <label>Повторите пароль</label>
      <input type="password" id="confirm-password" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="resetPassword()">Сохранить новый пароль</button>

    <div id="reset-message" class="message hidden"></div>

    <p class="link-text"><a href="/">← Вернуться ко входу</a></p>
  </div>

  <script>
    function showMsg(text, type) {
      const el = document.getElementById('reset-message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    async function resetPassword() {
      const token = new URLSearchParams(window.location.search).get('token');
      if (!token) { showMsg('Неверная ссылка', 'error'); return; }

      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;

      if (p1.length < 8) { showMsg('Пароль минимум 8 символов', 'error'); return; }
      if (p1 !== p2) { showMsg('Пароли не совпадают', 'error'); return; }

      const res = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: p1 })
      });
      const data = await res.json();

      if (res.ok) {
        showMsg('Пароль изменён! Переходим ко входу...', 'success');
        setTimeout(() => window.location.href = '/', 2000);
      } else {
        showMsg(data.detail || 'Ошибка', 'error');
      }
    }
  </script>
</body>
</html>
